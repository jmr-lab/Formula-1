# .github/workflows/update-data.yml
name: Refresh Pipeline
on:
  schedule:
    # Daily at 16:00 UTC = 02:00 AEST / 03:00 AEDT
    - cron: '0 16 * * *'

  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone ELT Repo (Read-Only)
        run: |
          git clone https://github.com/jmr-lab/f1-elt-pipeline.git --depth 1 --branch main elt-cache
      
      - name: DEBUG - Show Cloned Files
        run: |
          echo "=== sql/ ==="
          ls -la elt-cache/sql/
          echo ""
          echo "=== data/processed/ ==="
          ls -la elt-cache/data/processed/
      
      - name: Create Output Directories
        run: mkdir -p data/processed
      
      - name: Copy DB Files
        run: |
          cp elt-cache/sql/jolpica.db data/
          cp elt-cache/sql/formula1.db data/
      
      - name: Verify Downloaded Files
        run: |
          echo "=== data/ ==="
          ls -la data/
      
      - name: Commit Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update F1 data from ELT pipeline (${GITHUB_SHA:0:7})'
          file_pattern: 'data/*.db'
