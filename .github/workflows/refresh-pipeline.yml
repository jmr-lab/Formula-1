# .github/workflows/update-data.yml
name: Refresh Pipeline

on:
  schedule:
    # Daily at 16:00 UTC = 02:00 AEST / 03:00 AEDT
    - cron: '0 16 * * *'

  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone ELT Repo (Read-Only)
        run: |
          git clone https://github.com/jmr-lab/f1-elt-pipeline.git --depth 1 --branch main elt-cache

      - name: DEBUG - Show Cloned Files
        run: |
          echo "=== elt-cache/ ==="
          ls -la elt-cache/
          echo ""
          echo "=== elt-cache/dist/ ==="
          ls -la elt-cache/dist/

      - name: Copy DB Files
        run: |
          mkdir -p data
          cp elt-cache/dist/jolpica.db data/
          cp elt-cache/dist/formula1.db data/

      - name: Verify Downloaded Files
        run: |
          echo "=== data/ ==="
          ls -la data/
          echo ""
          echo "jolpica.db tables: $(sqlite3 data/jolpica.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table';")"
          echo "formula1.db tables: $(sqlite3 data/formula1.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table';")"

      - name: Commit Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update F1 data from ELT pipeline"
          file_pattern: 'data/*.db'

  get_dashboard:
    name: Get Dashboard
    needs: [refresh-data]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Trigger Databricks dashboard job and export HTML
        env:
          DATABRICKS_SERVER_HOSTNAME: ${{ secrets.DATABRICKS_SERVER_HOSTNAME }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          JOB_ID: ${{ secrets.DATABRICKS_DASHBOARD_JOB_ID }}
        run: |
          set -euo pipefail

          HOST="${DATABRICKS_SERVER_HOSTNAME#https://}"
          HOST="${HOST%/}"
          DATABRICKS_HOST="https://${HOST}"

          if [[ -z "${HOST}" ]]; then
            echo "DATABRICKS_SERVER_HOSTNAME is missing."
            exit 1
          fi

          if [[ -z "${DATABRICKS_TOKEN:-}" ]]; then
            echo "DATABRICKS_TOKEN is missing."
            exit 1
          fi

          if [[ -z "${JOB_ID:-}" || ! "$JOB_ID" =~ ^[0-9]+$ ]]; then
            echo "JOB_ID is missing or is not numeric."
            exit 1
          fi

          echo "Triggering Databricks dashboard job..."
          payload=$(jq -n --argjson job_id "$JOB_ID" '{job_id: $job_id}')

          response=$(curl --silent --show-error --fail-with-body \
            -X POST "$DATABRICKS_HOST/api/2.2/jobs/run-now" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")

          run_id=$(echo "$response" | jq -er '.run_id')
          echo "Started dashboard job run: $run_id"

          # Wait up to 30 minutes for the Databricks job to finish.
          for attempt in $(seq 1 120); do
            run=$(curl --fail --silent --show-error --get \
              "$DATABRICKS_HOST/api/2.2/jobs/runs/get" \
              -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              --data-urlencode "run_id=$run_id")

            life_cycle=$(echo "$run" | jq -r '.state.life_cycle_state')
            result=$(echo "$run" | jq -r '.state.result_state // ""')

            echo "Run state: $life_cycle $result"

            if [ "$life_cycle" = "TERMINATED" ]; then
              if [ "$result" != "SUCCESS" ]; then
                echo "Dashboard job failed."
                echo "$run" | jq '.state'
                exit 1
              fi
              break
            fi

            if [ "$life_cycle" = "INTERNAL_ERROR" ] || [ "$life_cycle" = "SKIPPED" ]; then
              echo "Dashboard job ended in state: $life_cycle"
              exit 1
            fi

            if [ "$attempt" -eq 120 ]; then
              echo "Timed out waiting for the Databricks job."
              exit 1
            fi

            sleep 15
          done

          curl --fail --silent --show-error --get \
            "$DATABRICKS_HOST/api/2.0/jobs/runs/export" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            --data-urlencode "run_id=$run_id" \
            --data-urlencode "views_to_export=DASHBOARDS" \
            -o dashboard-export.json

          mkdir -p site
          jq -er '.views[] | select(.type == "DASHBOARD") | .content' \
            dashboard-export.json > site/index.html

          test -s site/index.html
          echo "Dashboard HTML exported to site/index.html"

      - name: Upload dashboard HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-html
          path: site/
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    runs-on: ubuntu-latest
    needs: get_dashboard
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v4

      - name: Prepare site directory
        run: |
          mkdir -p site
          cp pages/index.html site/index.html
          if [ -f "pages/favicon.png" ]; then
            cp pages/favicon.png site/favicon.png
          fi

      - name: Download dashboard HTML
        uses: actions/download-artifact@v4
        with:
          name: dashboard-html
          path: site/dashboard

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
