# .github/workflows/update-data.yml
name: Update Data from ETL Pipeline
on:
  schedule:
    - cron: '3 0 * * 3'  # Wed 3 AM UTC
  workflow_dispatch:

jobs:
  clone-and-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone ETL Repo (Read-Only)
        run: |
          git clone https://github.com/jmr-lab/f1-etl-pipeline.git --depth 1 --branch main etl-cache
      
      - name: DEBUG - Show Cloned Files
        run: |
          echo "=== sql/ ==="
          ls -la etl-cache/sql/
          echo ""
          echo "=== data/processed/ ==="
          ls -la etl-cache/data/processed/
      
      - name: Create Output Directories
        run: mkdir -p data/processed
      
      - name: Copy DB Files
        run: |
          cp etl-cache/sql/f1summary.db data/
          cp etl-cache/sql/formula1.db data/
      
      - name: Copy CSV File
        run: |
          cp etl-cache/data/processed/f1summary.csv data/
      
      - name: Verify Downloaded Files
        run: |
          echo "=== data/ ==="
          ls -la data/
      
      - name: Commit Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update F1 data from ETL pipeline (${GITHUB_SHA:0:7})'
          file_pattern: 'data/*.db data/f1summary.csv'
