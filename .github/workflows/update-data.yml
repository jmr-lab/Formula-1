# .github/workflows/update-data.yml
name: Update Data from ETL Pipeline
on:
  schedule:
    - cron: '3 0 * * 3'  # Wed 3 AM UTC (3 hours after ETL)
  workflow_dispatch:

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Latest Release Assets
        uses: robinraju/release-downloader@v1
        with:
          repository: 'your-username/f1-etl-pipeline'
          tag: 'data-latest'
          out-file-path: 'downloads'           # ← Changed from 'data/raw'
      
      - name: DEBUG - Show All Downloaded Files
        run: |
          echo "=== Top-level contents ==="
          ls -la downloads/
          
          echo ""
          echo "=== All .db and .csv files recursively ==="
          find downloads -type f \( -name "*.db" -o -name "*.csv" \)
          
          echo ""
          echo "=== Full directory tree ==="
          find downloads -type f | head -30
      
      - name: Create Output Directories
        run: |
          mkdir -p data/processed
      
      - name: Copy Data Files (Flexible Discovery)
        run: |
          # Copy all .db files wherever they are
          find downloads -name "*.db" -exec cp {} data/ \;
          
          # Copy f1summary.csv specifically
          find downloads -name "f1summary.csv" -exec cp {} data/processed/ \;
      
      - name: Verify Downloaded Files
        run: |
          echo "=== data/ ==="
          ls -la data/
          
          echo ""
          echo "=== data/processed/ ==="
          ls -la data/processed/
      
      - name: Commit Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update F1 data from ETL pipeline (${GITHUB_SHA:0:7})'
          file_pattern: 'data/*.db data/processed/f1summary.csv'
