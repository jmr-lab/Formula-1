# .github/workflows/render-pdf.yml
name: Render PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      # The previous build rendered every glyph as an empty box :
      # TinyTeX minimal lacks the OpenType font collections.
      # lm + lm-math + collection-fontsrecommended provide the missing fonts,
      # tex-gyre provides mainfont/coverfont.
      - name: Install LaTeX packages
        run: |
          tlmgr install xetex fontspec realscripts
          tlmgr install tex-gyre
          tlmgr install lm lm-math collection-fontsrecommended
          tlmgr install eso-pic wallpaper draftwatermark etoolbox
          tlmgr install booktabs caption multirow colortbl geometry hyperref tools
          tlmgr install float || true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.11'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c(
            "rmarkdown", "knitr",
            "cowplot", "dplyr", "tidyr", "dm",
            "ggplot2", "ggrepel", "RColorBrewer",
            "kableExtra", "DBI", "RSQLite",
            "tibble", "purrr", "here"
          ))
        shell: Rscript {0}

      - name: Run orchestrator
        run: Rscript src/00-Orchestrator.R

      - name: Check PDF was produced
        run: |
          if [ ! -f report/Formula1.pdf ]; then
            echo "::error::Render finished but report/Formula1.pdf is missing"
            find . -name "*.log" -exec echo "--- {} ---" \; -exec tail -n 30 {} \;
            exit 1
          fi

      - name: Move PDF to report/
        run: mv report/Formula1.pdf report/Formula-2.pdf

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- report/
          if git diff --cached --quiet; then
            echo "No PDF change to commit"
          else
            git commit -m "Update report/Formula-2.pdf [skip ci]"
            git push
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formula-2
          path: report/Formula-2.pdf
          if-no-files-found: error
