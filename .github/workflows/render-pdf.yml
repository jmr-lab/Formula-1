# .github/workflows/render-pdf.yml
name: Render PDF

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages
        run: |
          tlmgr install xetex
          tlmgr install eso-pic
          tlmgr install draftwatermark
          tlmgr install etoolbox

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c(
            "rmarkdown", "knitr",
            "cowplot", "dplyr", "tidyr", "dm",
            "ggplot2", "ggrepel", "RColorBrewer",
            "kableExtra", "DBI", "RSQLite",
            "tibble", "purrr", "here"
          ))
        shell: Rscript {0}

      - name: Run orchestrator
        run: Rscript src/00-Orchestrator.R

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formula-1
          path: Formula-1.pdf
