# .github/workflows/render-pdf.yml
name: Render PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages
        run: |
          tlmgr install xetex
          tlmgr install eso-pic
          tlmgr install draftwatermark
          tlmgr install etoolbox

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c(
            "rmarkdown", "knitr",
            "cowplot", "dplyr", "tidyr", "dm",
            "ggplot2", "ggrepel", "RColorBrewer",
            "kableExtra", "DBI", "RSQLite",
            "tibble", "purrr", "here"
          ))
        shell: Rscript {0}

      - name: Run orchestrator
        run: Rscript src/00-Orchestrator.R

      - name: Debug - find PDF
        run: find . -name "*.pdf" -type f
   
      - name: Move PDF to report/
        run: |
          mkdir -p report
          mv Formula-1.pdf report/Formula-2.pdf

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/Formula-2.pdf
          git commit -m "Update report/Formula-2.pdf [skip ci]"
          git push

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formula-2
          path: report/Formula-2.pdf
