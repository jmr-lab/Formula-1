# .github/workflows/render-pdf.yml
name: Render PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      # TeX Gyre fonts ship with TeX Live (GUST, free licence) :
      # no system font install, no Google/Microsoft dependency.
      # fontspec is required by xelatex font loading (\newfontfamily).
      # NOTE: `array` and `longtable` live in the `tools` bundle on CTAN/TeX Live,
      # they are NOT standalone tlmgr package names.
      - name: Install LaTeX packages
        run: |
          tlmgr install xetex fontspec realscripts
          tlmgr install tex-gyre
          tlmgr install eso-pic draftwatermark etoolbox
          # Commonly required by the pdf_document template and kableExtra
          # (`tools` provides array, longtable, tabularx, ...) :
          tlmgr install booktabs caption multirow colortbl geometry hyperref tools
          # Non-fatal safety net : never break the workflow over a package
          # that is already present or renamed upstream
          tlmgr install float || true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c(
            "rmarkdown", "knitr",
            "cowplot", "dplyr", "tidyr", "dm",
            "ggplot2", "ggrepel", "RColorBrewer",
            "kableExtra", "DBI", "RSQLite",
            "tibble", "purrr", "here"
          ))
        shell: Rscript {0}

      - name: Run orchestrator
        run: Rscript src/00-Orchestrator.R

      # Fail LOUD and EARLY if the render did not produce the PDF,
      # instead of failing silently at the commit step later.
      - name: Check PDF was produced
        run: |
          if [ ! -f report/Formula1.pdf ]; then
            echo "::error::Orchestrator finished but report/Formula1.pdf is missing"
            find . -name "*.log" -exec echo "--- {} ---" \; -exec tail -n 30 {} \;
            exit 1
          fi

      - name: Move PDF to report/
        run: mv report/Formula1.pdf report/Formula-2.pdf

      # -A on the whole report/ folder : stages the NEW file AND the
      # deletion of the old Formula1.pdf (rename seen as one change).
      # Guard : skip commit when nothing changed (avoids exit 1 on empty index).
      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- report/
          if git diff --cached --quiet; then
            echo "No PDF change to commit"
          else
            git commit -m "Update report/Formula-2.pdf [skip ci]"
            git push
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formula-2
          path: report/Formula-2.pdf
          if-no-files-found: error
